
name: Build TEXARI Android APK V0.2 from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract TEXARI source
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q TEXARI_V0.2_FULL_SOURCE.zip -d build_src
          cp -R build_src/texari_v02_full_plain/. .

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TEXARI-v0.2-evaluation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.2-evaluation-APK
          path: TEXARI-v0.2-evaluation.apk
          retention-days: 14
