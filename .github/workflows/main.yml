name: Build TEXARI V0.9 Play Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract TEXARI source
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q TEXARI_V0.2_FULL_SOURCE.zip -d build_src
          cp -R build_src/texari_v02_full_plain/. .

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Prepare and validate Play signing
        shell: bash
        env:
          KEYSTORE_B64_RAW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD_RAW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64_RAW" || (echo "Missing ANDROID_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD_RAW" || (echo "Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD" && exit 1)

          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '[:space:]')"
          KEY_ALIAS="texari-upload"
          KEY_PASSWORD="$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64_RAW" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/texari-upload-key.jks"

          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/texari-upload-key.jks" | awk '{print $1}')"
          EXPECTED_SHA="1670edbc806f257a5cb2b3cdc60505a060f03b1c66ca8f62be40efd21f137360"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Signing key content does not match the TEXARI upload key backup."
            exit 1
          fi

          keytool -list \
            -keystore "$RUNNER_TEMP/texari-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/texari-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build beta APK and release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Sign Play AAB explicitly
        shell: bash
        run: |
          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      - name: Verify Play AAB is actually signed
        shell: bash
        run: |
          set -o pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | tee /tmp/texari-signature-check.txt
          grep -q "jar verified\." /tmp/texari-signature-check.txt
          if grep -q "jar is unsigned" /tmp/texari-signature-check.txt; then
            echo "ERROR: AAB is unsigned"
            exit 1
          fi

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TEXARI-v0.9-beta.apk
          cp app/build/outputs/bundle/release/app-release.aab TEXARI-v0.9-play-beta-SIGNED.aab

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.9-beta-APK
          path: TEXARI-v0.9-beta.apk
          retention-days: 14

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.9-play-beta-SIGNED-AAB
          path: TEXARI-v0.9-play-beta-SIGNED.aab
          retention-days: 14
