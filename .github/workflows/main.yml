name: Build TEXARI Android APK V0.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create TEXARI V0.2 app files
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/app/texari/evaluation app/src/main/res/xml
          printf '%s' 'H4sIAOFpnGoC/5WOsQrCMBiE9zzFv1UXH0BxEKmgqA3Vvfw0R4ik+UOaiiK+u9bRQfC2O467L/rBunDgwBYdQqaHorcSovQuS3Lo6UFWxHpMpgvq+IqwfhcT+9HbxMZDf1a0pDym9FRPZRARDEJ7r9GLH7KT3zcHMZj1yJP6O9ystvumOja6rnbl+tzUpa5O0384P0RJJOskF7R5FrgDLak448bJlVf2A4+EhXKh9YMBFXOOsVAvyVTlUSABAAA=' | base64 -d | gzip -d > settings.gradle
          printf '%s' 'H4sIAOFpnGoC/yvIKU3PzCtWqOZSAILMFAX15PxcvcS8lKL8zBS9xIKCnMzkxJLM/Dx1hbLUomIgQ0HdQs9cz1hdASRZqZCWmFOcylXLBQCyol9fSQAAAA==' | base64 -d | gzip -d > build.gradle
          printf 'android.useAndroidX=true\n' > gradle.properties
          printf '%s' '' | base64 -d | gzip -d > app/build.gradle
          printf '%s' 'H4sIAOFpnGoC/y2NwQ7CIBBE73zFZu9l9WYaoN+yARSiLA2g8fOlpnOYw8vLjNm+5QWf2HquYvGqLwhRfA1ZHhbf477ccHPK7DxSh+lKX1lCqzlYTGPsK1H3KRbu+uTa10K8P6nFTidDp2DGeJ7ucoyBcIkW/ezGCAeyqBFontH/zakfDDOftJ0AAAA=' | base64 -d | gzip -d > app/src/main/res/xml/file_paths.xml
          printf '%s' '' | base64 -d | gzip -d > app/src/main/AndroidManifest.xml
          printf '%s' '' | base64 -d | gzip -d > app/src/main/java/app/texari/evaluation/MainActivity.java

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TEXARI-v0.2-evaluation.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.2-evaluation-APK
          path: TEXARI-v0.2-evaluation.apk
          retention-days: 14
