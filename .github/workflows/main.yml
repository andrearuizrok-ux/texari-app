name: Build TEXARI V0.9 Play Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract TEXARI source
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q TEXARI_V0.2_FULL_SOURCE.zip -d build_src
          cp -R build_src/texari_v02_full_plain/. .

      - name: Install Android 16 platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Prepare and validate Play signing
        shell: bash
        env:
          KEYSTORE_B64_RAW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD_RAW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64_RAW" || (echo "Missing ANDROID_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD_RAW" || (echo "Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS_RAW" || (echo "Missing ANDROID_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD_RAW" || (echo "Missing ANDROID_UPLOAD_KEY_PASSWORD" && exit 1)

          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '\r\n')"
          printf '%s' "$KEYSTORE_B64_RAW" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/texari-upload-key.jks"

          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/texari-upload-key.jks" | awk '{print $1}')"
          EXPECTED_SHA="1670edbc806f257a5cb2b3cdc60505a060f03b1c66ca8f62be40efd21f137360"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Signing key content does not match the TEXARI upload key backup. Update ANDROID_UPLOAD_KEYSTORE_B64."
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/texari-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Signing key opened incorrectly. Check keystore password and alias."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/texari-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build beta APK and signed Play AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Verify signed AAB
        run: jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TEXARI-v0.9-beta.apk
          cp app/build/outputs/bundle/release/app-release.aab TEXARI-v0.9-play-beta.aab

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.9-beta-APK
          path: TEXARI-v0.9-beta.apk
          retention-days: 14

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: TEXARI-v0.9-play-beta-AAB
          path: TEXARI-v0.9-play-beta.aab
          retention-days: 14
